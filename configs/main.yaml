# 主实验配置 v2（两日计划）—— 机器可读版协议 §6
# 范围冻结 2026-11-12：只复现 C2，只跑 PenDigits + COIL-20；缩减理由见 docs/DEVIATIONS.md D18。
# 读取方：scripts/run_grid.py / run_runtime.py；改这里先改 PROTOCOL 并登记偏离。

seed: 42
n_jobs: 1                     # joblib 在本机串行，写 1 避免误导
num_threads_env: "NUMBA_NUM_THREADS=1"

paths:
  raw: data/raw
  processed: data/processed
  manifests: data/manifests
  results: results
  figures: figures/results
  embeddings_cache: results/raw

datasets:
  pendigits:
    source: sklearn            # sklearn.datasets.load_digits，1797 版（与原文一致）
    n_expected: 1797
    d_expected: 64
    folds: 10
    subsample_per_class: null
    k: [10, 20, 40, 80, 160]
    claims: [C2]
  coil20:
    source: zip
    url: "https://www.cs.columbia.edu/CAVE/databases/SLAM_coil-20_coil-100/coil-20/coil-20-proc.zip"
    n_expected: 1440
    d_expected: 16384
    folds: 10
    subsample_per_class: null
    k: [10, 20, 40, 80, 160]
    claims: [C2]

methods:
  pca:
    impl: sklearn
    n_components: 2
  tsne:
    impl: sklearn
    n_components: 2
    perplexity: 30
    init: pca
    learning_rate: auto
    max_iter: 1000
    random_state: 42
  umap_ref:
    impl: umap-learn
    n_neighbors: 15
    min_dist: 0.1
    n_components: 2
    n_epochs: 500
    init: spectral
    random_state: 42
  umap_ours:
    impl: ours
    n_neighbors: 15
    min_dist: 0.1
    n_components: 2
    n_epochs: 500
    init: spectral
    random_state: 42
    negative_sample_rate: 5
    repulsion_strength: 1.0
    learning_rate: 1.0
    metric: euclidean
  # le 不在本轮范围（D18）；仅当两日计划有余量时手动加回，不进入主表

knn:                           # PROTOCOL E2
  classifier: KNeighborsClassifier
  algorithm: brute
  metric: euclidean
  weights: uniform
  transductive: true           # 嵌入用全体点（无标签），分类器只用 train 折

runtime:                       # PROTOCOL E4（本轮只留 4 行小表）
  repeats: 3
  timeout_s: 1800
  timer: perf_counter

tolerance:                     # PROTOCOL §5.2，冻结，勿改
  pendigits: 0.03
  coil20: 0.10

outputs:
  grid_knn: results/grid_knn.csv
  grid_knn_summary: results/grid_knn_summary.csv
  runtime: results/runtime.csv
  paper_vs_ours: results/paper_vs_ours.csv

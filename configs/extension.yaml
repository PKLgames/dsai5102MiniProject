# 扩展实验配置 —— 本轮**未执行**（范围缩减，见 docs/log/DEVIATIONS.md D18）
# 两日计划里没有超参热力图的位置；若 11-18 之后有余量，用本文件直接跑：
#   .venv/bin/python scripts/run_extension.py --config configs/extension.yaml
# 48 组嵌入在 PenDigits 上约 10 min，COIL-20 上约 14 min。

executed: false
reason: "D18 范围缩减：本轮只复现 C2；热力图列为放弃项"

seed: 42
datasets: [pendigits, coil20]

grid:
  n_neighbors: [5, 10, 15, 30, 50, 100]
  min_dist: [0.0, 0.1, 0.5, 0.8]

base:
  n_components: 2
  n_epochs: 500
  init: spectral
  metric: euclidean
  negative_sample_rate: 5
  repulsion_strength: 1.0
  learning_rate: 1.0

metrics:
  - name: knn_acc
    params: {k: 10}
  - name: knn_acc
    params: {k: 100}
  - name: silhouette
  - name: trustworthiness
    params: {n_neighbors: 15}

outputs:
  table: results/extension_heatmap.csv
  figure: figures/results/fig5_extension_heatmap.png
